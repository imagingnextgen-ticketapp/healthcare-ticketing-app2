<h2 mat-dialog-title>Select Hospital</h2>

<mat-dialog-content>

    <p class="dialog-text">
        Your account is assigned to multiple hospitals.
        Please select the hospital you want to work with.
    </p>

    <label class="site-search-label" for="site-search">Search hospitals</label>
    <input
        id="site-search"
        class="site-search"
        type="search"
        [(ngModel)]="siteSearchTerm"
        placeholder="Search by hospital name"
        aria-label="Search hospitals by name"
        autocomplete="off">

    <div class="site-list" role="region" aria-label="Hospital options">
    <mat-radio-group
        [(ngModel)]="selectedSiteId"
        class="site-radio-group"
        aria-label="Select a hospital">

        <mat-radio-button
            *ngFor="let site of filteredSites"
            [value]="site.siteId"
            class="site-radio">

            {{site.siteName}}

        </mat-radio-button>

    </mat-radio-group>
    <p *ngIf="filteredSites.length === 0" class="no-sites-message" role="status">
        No hospitals match your search.
    </p>
    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
    mat-button
    class="cancel-btn"
    (click)="onCancel()">

    Cancel

</button>

   <button
    mat-flat-button
    class="continue-btn"
    [disabled]="!selectedSiteId"
    (click)="onContinue()">

    Continue

</button>

</mat-dialog-actions>
